
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login — All You Can Read</title>
    <style>
        body { font-family: Arial, sans-serif; background: #d6e0e9; }
        .container {
            width: 400px; margin: 100px auto; background: white;
            padding: 30px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #1e4f9b; margin-top: 0; }
        label { font-size: 13px; color: #555; display: block; margin-top: 12px; margin-bottom: 3px; }
        input {
            width: 100%; box-sizing: border-box; padding: 8px;
            border: 1px solid #b0c4d8; border-radius: 4px; font-size: 14px;
        }
        button {
            margin-top: 20px; width: 100%; padding: 10px; background: #1e4f9b;
            color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer;
        }
        button:hover { background: #163a75; }
        .link { text-align: center; margin-top: 14px; font-size: 13px; }
        .link a { color: #1e4f9b; }
        .error { color: #c0392b; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login</h1>
        <form method="POST">
            {% csrf_token %}
            <label>Utilizador</label>
            <input type="text" name="username" autofocus>
            <label>Password</label>
            <input type="password" name="password">
            {% if form.errors %}
                <p class="error">Utilizador ou password incorretos.</p>
            {% endif %}
            <button type="submit">Entrar</button>
        </form>
        <div class="link">
            Não tens conta? <a href="{% url 'registo' %}">Regista-te aqui</a>
        </div>
    </div>
</body>
</html>
