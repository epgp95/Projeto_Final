<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sessão terminada</title>
    <style>
        body { font-family: Arial, sans-serif; background: #d6e0e9; }
        .container {
            width: 400px; margin: 100px auto; background: white;
            padding: 30px; border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #1e4f9b; margin-top: 0; }
        a {
            display: inline-block; margin-top: 14px;
            padding: 9px 18px; background: #1e4f9b;
            color: white; text-decoration: none;
            border-radius: 4px; font-size: 14px;
        }
        a:hover { background: #163a75; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sessão terminada</h1>
        <p>A tua sessão foi encerrada com sucesso.</p>
        <a href="{% url 'login' %}">Voltar ao login</a>
    </div>
</body>
</html>
