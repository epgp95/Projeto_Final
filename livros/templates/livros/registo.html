
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Registo — All You Can Read</title>
    <style>
        body { font-family: Arial, sans-serif; background: #d6e0e9; }
        .container {
            width: 400px; margin: 60px auto; background: white;
            padding: 30px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #1e4f9b; margin-top: 0; }
        label { font-size: 13px; color: #555; display: block; margin-top: 12px; margin-bottom: 3px; }
        input {
            width: 100%; box-sizing: border-box; padding: 8px;
            border: 1px solid #b0c4d8; border-radius: 4px; font-size: 14px;
        }
        button {
            margin-top: 20px; width: 100%; padding: 10px; background: #1e4f9b;
            color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer;
        }
        button:hover { background: #163a75; }
        .link { text-align: center; margin-top: 14px; font-size: 13px; }
        .link a { color: #1e4f9b; }
        .errorlist { color: #c0392b; font-size: 12px; list-style: none; padding: 0; margin: 4px 0 0 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Criar Conta</h1>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            {% endfor %}
            <button type="submit">Registar</button>
        </form>
        <div class="link">
            Já tens conta? <a href="{% url 'login' %}">Faz login aqui</a>
        </div>
    </div>
</body>
</html>
