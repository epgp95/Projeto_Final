<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #d6e0e9; }
        .container {
            width: 500px; margin: 60px auto; background: white;
            padding: 30px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #1e4f9b; margin-top: 0; }
        label { font-size: 13px; color: #555; display: block; margin-bottom: 3px; margin-top: 12px; }
        input, select {
            display: block; width: 100%; box-sizing: border-box;
            padding: 8px; border: 1px solid #b0c4d8; border-radius: 4px; font-size: 14px;
        }
        button {
            margin-top: 20px; padding: 9px 18px; background: #1e4f9b;
            color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;
        }
        button:hover { background: #163a75; }
        a { display: inline-block; margin-top: 14px; color: #1e4f9b; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{% if livro %}Editar Livro{% else %}Adicionar Novo Livro{% endif %}</h1>

        <form method="POST">
            {% csrf_token %}

            <label>Título</label>
            <input type="text" name="titulo" value="{{ livro.titulo|default:'' }}" placeholder="Título do livro">

            <label>Autor</label>
            <input type="text" name="autor" value="{{ livro.autor|default:'' }}" placeholder="Nome do autor">

            <label>Preço (€)</label>
            <input type="number" name="preco" value="{{ livro.preco|default:'' }}" placeholder="0.00" step="0.01" min="0">

            <label>Stock (unidades)</label>
            <input type="number" name="stock" value="{{ livro.stock|default:1 }}" min="1">

            <label>Tipo</label>
            <select name="tipo">
                <option value="capa_mole" {% if livro.tipo == "capa_mole" %}selected{% endif %}>Capa Mole</option>
                <option value="capa_dura" {% if livro.tipo == "capa_dura" %}selected{% endif %}>Capa Dura</option>
                <option value="bolso"     {% if livro.tipo == "bolso"     %}selected{% endif %}>Livro de Bolso</option>
                <option value="outro"     {% if livro.tipo == "outro" or not livro %}selected{% endif %}>Outro</option>
            </select>

            <label>Ano de publicação</label>
            <input type="number" name="ano" value="{{ livro.ano|default:'' }}" placeholder="ex: 2020" min="1900" max="2099">

            <button type="submit">Guardar</button>
        </form>

        <a href="{% url 'lista_livros' %}">← Ver Lista de Livros</a>
    </div>
</body>
</html>
